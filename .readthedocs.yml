# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# build.os and build.tools are required by the RTD v2 schema. With conda:
# below, build.tools.python picks the conda installer (miniforge3 ships
# mamba for fast solves); the actual Python version comes from
# docs/environment.yml. Valid values are a fixed enum - see
# https://docs.readthedocs.com/platform/stable/config-file/v2.html#build-tools-python
build:
  os: ubuntu-22.04
  tools:
    python: "miniforge3-latest"

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/conf.py

conda:
  environment: docs/environment.yml

submodules:
  include:
   - libraries/sky130_fd_io/latest
   - libraries/sky130_fd_sc_hd/latest
   - libraries/sky130_fd_sc_hdll/latest
   - libraries/sky130_fd_sc_hs/latest
   - libraries/sky130_fd_sc_ls/latest
   - libraries/sky130_fd_sc_ms/latest
  recursive: false

# PDF/LaTeX output disabled: the sphinx-latex + latexmk steps add ~7 min,
# pushing the build past RTD's 15-min community limit (HTML alone is ~7 min
# including submodules + conda). Re-enable on a tier with a higher limit.
formats: []
